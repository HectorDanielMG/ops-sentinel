services:
  ops-sentinel:
    build: .
    container_name: ops-sentinel
    ports:
      - "8000:8000"
    environment:
      CHECK_INTERVAL_SECONDS: "30"
      REQUEST_TIMEOUT_SECONDS: "4"
      DATABASE_PATH: /data/ops-sentinel.db
    volumes:
      - sentinel-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sentinel-data:
